<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" role="img" aria-labelledby="iv-title iv-desc">
  <title id="iv-title">Irregular observation times</title>
  <desc id="iv-desc">An underlying covariate trajectory drawn as a dashed curve, with solid points marking the few irregularly spaced times at which it is actually recorded.</desc>
  <style>
    .axis { stroke: #7f8c9b; }
    .traj { stroke: #2f7f96; }
    .stem { stroke: #b3bec9; }
    .obs { fill: #2f7f96; }
    @media (prefers-color-scheme: dark) {
      .axis { stroke: #97a4b1; }
      .traj { stroke: #58b0c6; }
      .stem { stroke: #6c7885; }
      .obs { fill: #58b0c6; }
    }
  </style>

  <path class="axis" fill="none" stroke-width="1.6" d="M24 172H278" />
  <polyline class="traj" fill="none" stroke-width="1.8" stroke-dasharray="5 4"
    points="26,128 46,112 66,96 86,92 106,106 126,124 146,134 166,122 186,102 206,86 226,84 246,98 266,114 278,120" />
  <g class="stem" stroke-width="1" stroke-dasharray="2 3">
    <path d="M46 112V172M86 92V172M126 124V172M166 122V172M206 86V172M246 98V172" />
  </g>
  <g class="obs">
    <circle cx="46" cy="112" r="5" />
    <circle cx="86" cy="92" r="5" />
    <circle cx="126" cy="124" r="5" />
    <circle cx="166" cy="122" r="5" />
    <circle cx="206" cy="86" r="5" />
    <circle cx="246" cy="98" r="5" />
  </g>
</svg>
